name: Party
version: ${project.version}
main: com.wolfdrache.party.Party
api-version: 1.19
description: A party and friends plugin for Minecraft 1.19.3
author: Wolfdrache

commands:
  party:
    description: partyCommand
    usage: /party <subcommand> [args]
  partychat:
    description: partyChatCommand
    usage: /partychat <message>
    aliases: [pc]
  friends:
    description: friendsCommand
    usage: /friends <subcommand> [args]
  report:
    description: reportCommand
    usage: /report <player> <category> <reason> <message>

  join:
    description: joinCommand for Game Modes
    usage: /join <gamemode> [args]
  leave:
    description: leaveCommand for Game Modes
    usage: /leave [<gamemode>]
  start:
    description: startCommand for Game Modes
    usage: /start [<gamemode>]
    permission: gamemodes.start
  stats:
    description: statsCommand for Game Modes
    usage: /stats <gamemode>
  admin:
    description: adminCommand for Game Modes
    usage: /admin <plugin> <subcommand> [args]
    permission: gamemodes.admin
  forcejoin:
    description: forceJoinCommand for Game Modes
    usage: /forcejoin <gamemode> [args]
    permission: gamemodes.forcejoin
  

permissions:
  gamemodes.start:
    description: Allows starting game modes
    default: false
  gamemodes.admin:
    description: Allows admin commands for game modes
    default: false
  gamemodes.forcejoin:
    description: Allows force joining game modes
    default: false
    
  social.friends.unlimited:
    description: Allows unlimited friends
    default: false
  reports.manage:
    description: Allows managing reports
    default: false
  reports.delete:
    description: Allows deleting reports
    default: false
    children:
      reports.manage: true